name: Deploy to GitHub Pages
# Triển khai khi main thay đổi hoặc khi chạy thủ công trên GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Các lần triển khai cùng dùng một nhóm để không ghi đè lẫn nhau.
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        # Đọc khóa từ GitHub Secrets trong lúc tạo bản triển khai.
        # Khóa vẫn xuất hiện trong file gửi đến trình duyệt, nên người truy cập có thể xem được.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Tạo thư mục xuất bản, thêm mã phiên bản vào URL script để tránh dùng bản cũ trong cache.
          mkdir -p _site/src
          node -e 'const fs = require("fs"); const version = process.env.GITHUB_SHA; const html = fs.readFileSync("index.html", "utf8").replace(/(src="\.\/src\/(?:app|ai-config)\.js)(")/g, `$1?v=${version}$2`); fs.writeFileSync("_site/index.html", html);'
          cp src/app.js _site/src/app.js
          node -e 'require("fs").writeFileSync("_site/src/ai-config.js", "window.FOCUSLEARN_AI = " + JSON.stringify({apiKey: process.env.GEMINI_API_KEY || ""}) + ";\n")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    # Chỉ xuất bản sau khi công việc build đã hoàn tất.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
