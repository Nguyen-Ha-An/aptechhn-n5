name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Contrast & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: WCAG Contrast Check
        run: bun run check:contrast

      - name: Unit Tests
        run: bun run test

      - name: Production Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-anon-key

  db:
    name: Supabase Database Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (db, auth, rest, mail)
        run: supabase start -x realtime,storage-api,imgproxy,studio,logflare,vector,supavisor

      - name: Run Database Tests
        run: supabase test db

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Supabase
        run: supabase start -x realtime,storage-api,imgproxy,studio,logflare,vector,supavisor

      - name: Setup environment and test configs
        run: |
          eval "$(supabase status -o env | grep -E '^[A-Z_]+=')"
          cat <<EOF > .env.local
          VITE_SUPABASE_URL=$API_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}
          EOF
          echo "CHAT_FAKE_MODEL=1" > .env.functions

      - name: Serve Edge Functions (background)
        run: |
          supabase functions serve --env-file .env.functions &
          echo "Waiting for Edge Functions server to respond..."
          READY=0
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:54321/functions/v1/chat || true)
            if [ -n "$STATUS" ] && [ "$STATUS" != "000" ]; then
              echo "Edge Functions responding with HTTP $STATUS after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Edge Functions server failed to start within 60s"
            exit 1
          fi

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: bun run test:e2e
