<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in to FocusLearn</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1f1e1c; background-color: #fbfaf7; padding: 24px; line-height: 1.5;">
  <h2 style="color: #1f1e1c; margin-bottom: 16px;">Sign in to FocusLearn</h2>
  <p style="margin-bottom: 24px;">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 10px 20px; background-color: #b5432f; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 500;">Sign in</a>
  </p>
  <p style="margin-bottom: 16px;">Or enter this code: <strong>{{ .Token }}</strong></p>
  <p style="color: #787672; font-size: 14px;">If you did not ask for this, ignore this email.</p>
</body>
</html>
